name: Laravel ZIP deploy to Rumahweb

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, curl, zip, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies for tests
        run: composer install --no-interaction --prefer-dist --no-progress

      # - name: Run Laravel tests
      #   run: php artisan test

      - name: Install production PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Package private and public archives
        run: |
          set -euo pipefail
          mkdir -p .deploy/app .deploy/public .deploy/artifacts
          rsync -a ./ .deploy/app/ \
            --exclude='/.deploy/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='/node_modules/' \
            --exclude='/storage/' \
            --exclude='/tests/' \
            --exclude='/deploy/' \
            --exclude='/bootstrap/cache/*.php'
          rsync -a public/ .deploy/public/ \
            --exclude='/index.php' \
            --exclude='/__deploy.php'
          # ZIP runner rejects symbolic links for safety.
          if find .deploy/app .deploy/public -type l -print -quit | grep -q .; then
            echo 'Symlinks found in build artifacts; inspect before deploying.' >&2
            exit 1
          fi
          (cd .deploy/app && zip -qr "../artifacts/${GITHUB_SHA}-app.zip" .)
          (cd .deploy/public && zip -qr "../artifacts/${GITHUB_SHA}-public.zip" .)
          sha256sum .deploy/artifacts/*.zip

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload both ZIPs via verified FTPS
        env:
          HOST: ${{ secrets.FTP_HOST }}
          USER: ${{ secrets.FTP_APP_USERNAME }}
          PASS: ${{ secrets.FTP_APP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -u "$USER","$PASS" "ftp://$HOST" <<LFTP
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          mkdir -p .deploy/incoming
          put .deploy/artifacts/${GITHUB_SHA}-app.zip -o .deploy/incoming/${GITHUB_SHA}-app.zip
          put .deploy/artifacts/${GITHUB_SHA}-public.zip -o .deploy/incoming/${GITHUB_SHA}-public.zip
          bye
          LFTP

